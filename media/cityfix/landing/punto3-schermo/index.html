<!doctype html>
<html lang="it">
  <!-- Dalla landing di CityFix (motion/view-chiuso), rifatto come schermo del telefono dello
       slot alto: 1080x2330, le proporzioni dello schermo del mockup. Va dentro punto3. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=2330" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 2330px;
        overflow: hidden;
        background: #fefeff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #fefeff;
      }
    </style>
  </head>
  <body>
    <!-- CityFix - "how it works" step 3: the job is closed, citizens earn points,
         the city improves. 10 s seamless loop, 30 fps, no audio. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="2330"
    >
      <div
        id="chiuso"
        data-composition-id="chiuso"
        data-composition-src="compositions/chiuso.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="2330"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
