  <script>
    (function () {
      // Nella scheda la card dell'impresa sta accanto alla lista del comune per tutto il
      // clip: in attesa finché il comune non affida (T0), poi la storia di sempre.
      const main = gsap.timeline({ paused: true });
      const tl = gsap.timeline();
      const T0 = 6.4;
      const FADE = 12.8; // come in desk.html: le due scene sfumano insieme
      const END = 13.7;
      const E = 'power3.out'; // DESIGN.md cubic-bezier(0.22, 1, 0.36, 1)
      const NI = { immediateRender: false };
      const BLUE = '#2b1ce8';
      const GREEN = '#e3f1de';

      // ---- Baseline: the impresa's bid is in, waiting for the comune ----
      const shown = ['#bid-sub-0', '#bid-btn-l1', '#bid-count-0', '#bid-p', '#bid-d'];
      const hidden = [
        '#bid-chip-a', '#bid-chip-c', '#bid-sub-1', '#bid-sub-2',
        '#bid-btn-l2', '#bid-btn-l3',
        '#bid-count-1', '#bid-count-2', '#bid-count-3',
        '#bid-bar-1', '#bid-bar-2', '#bid-bar-3',
        '#bid-photo-1', '#bid-photo-2', '#bid-photo-3',
        '#bid-tag-1', '#bid-tag-2', '#bid-tag-3',
      ];

      function show(sel, t) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.001, ...NI }, t);
      }
      function hide(sel, t) {
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, duration: 0.001, ...NI }, t);
      }
      // A UI state re-rendering: old text clears, then the new one settles in (never crossfaded).
      function swap(outSel, inSel, t, d = 0.3, inDelay = d * 0.58) {
        tl.fromTo(outSel, { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: d * 0.55, ease: 'power2.in', ...NI }, t);
        tl.fromTo(inSel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: d, ease: E, ...NI }, t + inDelay);
      }
      function fade(sel, from, to, t, d) {
        tl.fromTo(sel, { opacity: from }, { opacity: to, duration: d, ease: 'power2.inOut', ...NI }, t);
      }
      function press(t) {
        tl.fromTo('#bid-btn', { scale: 1 }, { scale: 0.97, duration: 0.09, ease: 'power2.out', ...NI }, t);
        tl.fromTo('#bid-btn', { scale: 0.97 }, { scale: 1, duration: 0.32, ease: E, ...NI }, t + 0.09);
      }
      // Button state change: old label out, fill changes, new label in once the fill has turned.
      function btnState(outSel, inSel, fromBg, toBg, t) {
        tl.fromTo(outSel, { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: 0.14, ease: 'power2.in', ...NI }, t);
        tl.fromTo('#bid-btn', { backgroundColor: fromBg }, { backgroundColor: toBg, duration: 0.2, ease: 'power2.inOut', ...NI }, t + 0.04);
        tl.fromTo(inSel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: E, ...NI }, t + 0.22);
      }

      // 1. The comune's choice lands: Assegnata a te (1.05)
      tl.fromTo('#bid-chip-a', { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: E, ...NI }, 1.05);
      swap('#bid-sub-0', '#bid-sub-1', 1.2);

      // 2. Carica le foto (1.85), tap (2.3)
      btnState('#bid-btn-l1', '#bid-btn-l2', GREEN, BLUE, 1.85);
      press(2.3);

      // 3. Three photos upload one by one (2.5 / 3.1 / 3.7)
      [2.5, 3.1, 3.7].forEach((t, i) => {
        const n = i + 1;
        fade(`#bid-bar-${n}`, 0, 1, t, 0.1);
        tl.fromTo(`#bid-fill-${n}`, { scaleX: 0 }, { scaleX: 1, duration: 0.38, ease: 'power1.inOut', ...NI }, t);
        fade(`#bid-photo-${n}`, 0, 1, t + 0.4, 0.26);
        tl.fromTo(`#bid-photo-${n}`, { scale: 1.04 }, { scale: 1, duration: 0.5, ease: E, ...NI }, t + 0.4);
        fade(`#bid-tag-${n}`, 0, 1, t + 0.6, 0.2);
        hide(`#bid-bar-${n}`, t + 0.7);
        hide(`#bid-count-${i}`, t + 0.46);
        show(`#bid-count-${n}`, t + 0.46);
      });

      // 4. Foto inviate al comune (4.5), status Completata (4.75)
      btnState('#bid-btn-l2', '#bid-btn-l3', BLUE, GREEN, 4.5);
      swap('#bid-chip-a', '#bid-chip-c', 4.75);
      swap('#bid-sub-1', '#bid-sub-2', 4.85);

      // 5. Loop: la card sfuma insieme alla lista e torna in attesa
      const baseline = (t) => {
        main.set(shown, { opacity: 1, y: 0 }, t);
        main.set(hidden, { opacity: 0, y: 0, scale: 1 }, t);
        main.set(['#bid-fill-1', '#bid-fill-2', '#bid-fill-3'], { scaleX: 0 }, t);
        main.set('#bid-btn', { backgroundColor: GREEN, scale: 1 }, t);
      };
      baseline(0);
      main.set('#bid-screen', { opacity: 1 }, 0);
      main.add(tl, T0);
      main.to('#bid-screen', { opacity: 0, duration: 0.3, ease: 'power2.in' }, FADE);
      baseline(FADE + 0.35);
      main.to('#bid-screen', { opacity: 1, duration: 0.4, ease: E }, FADE + 0.4);
      main.set({}, {}, END);

      window.__timelines['bid'] = main;
    })();
  </script>
