<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=822, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:Caprasimo;src:url('assets/fonts/caprasimo-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:Piazzolla;src:url('assets/fonts/piazzolla-var.woff2') format('woff2');font-weight:100 900}
:root{--paper:#FCFCF9;--ink:#1F130E;--mute:#C2BDB5;--rulli:#C92A6B;--tile:#F3C3D3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:822px;height:1080px;overflow:hidden;background:var(--paper)}
#root{position:absolute;inset:0;background:var(--paper);font-family:Piazzolla,serif;color:var(--ink)}
.title{position:absolute;left:63px;top:110px;font-family:Caprasimo;font-size:64px;color:var(--rulli)}
.band{position:absolute;left:43px;right:43px;top:470px;height:120px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.hit{position:absolute;inset:0;background:var(--tile);opacity:0}
.win{position:absolute;top:230px;width:128px;height:600px;overflow:hidden}
.reel{position:absolute;left:0;top:0;width:128px}
.reel div{height:120px;display:flex;align-items:center;justify-content:center;font-family:Caprasimo;font-size:76px;color:var(--ink)}
.fade{position:absolute;left:0;right:0;height:240px;pointer-events:none}
.found{position:absolute;left:63px;right:63px;top:860px;display:flex;gap:16px;flex-wrap:wrap}
.found span{font-weight:600;font-size:26px;letter-spacing:.12em;padding:8px 16px;border-radius:6px;background:var(--tile);color:var(--ink);opacity:0}
.mk{position:absolute;left:397px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="822" data-height="1080">
<div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0" data-layout-allow-overlap>
<div class="title">Rulli</div>
<div class="band"><div class="hit" id="hit"></div></div>
<div class="win" data-layout-allow-occlusion style="left:63px"><div class="reel" id="reel0"><div>L</div><div>P</div><div>M</div><div>C</div><div>L</div><div>P</div><div>M</div><div>C</div><div>L</div><div>P</div><div>M</div><div>C</div><div>L</div><div>P</div><div>M</div><div>C</div></div></div>

<div class="win" data-layout-allow-occlusion style="left:347px"><div class="reel" id="reel2"><div>T</div><div>S</div><div>R</div><div>N</div><div>T</div><div>S</div><div>R</div><div>N</div><div>T</div><div>S</div><div>R</div><div>N</div><div>T</div><div>S</div><div>R</div><div>N</div></div></div>
<div class="win" data-layout-allow-occlusion style="left:489px"><div class="reel" id="reel3"><div>V</div><div>C</div><div>S</div><div>T</div><div>V</div><div>C</div><div>S</div><div>T</div><div>V</div><div>C</div><div>S</div><div>T</div><div>V</div><div>C</div><div>S</div><div>T</div></div></div>
<div class="win" data-layout-allow-occlusion style="left:631px"><div class="reel" id="reel4"><div>I</div><div>A</div><div>O</div><div>E</div><div>I</div><div>A</div><div>O</div><div>E</div><div>I</div><div>A</div><div>O</div><div>E</div><div>I</div><div>A</div><div>O</div><div>E</div></div></div>
<div class="fade" data-layout-allow-occlusion style="top:230px;background:linear-gradient(var(--paper),rgba(252,252,249,0.15))"></div>
<div class="fade" data-layout-allow-occlusion style="top:590px;background:linear-gradient(rgba(252,252,249,0.15),var(--paper))"></div>
<div class="found"><span id="fw0">PESCA</span><span id="fw1">MORSO</span><span id="fw2">CANTO</span></div>
</div>
</div>
<script>
const tl=gsap.timeline({paused:true});

tl.fromTo("#fw1",{opacity:0,y:12},{opacity:1,y:0,duration:0.25,ease:"expo.out"},4.58);

tl.to("#reel1",{y:-600,duration:0.5,ease:"power3.inOut"},6.14);
tl.to("#reel2",{y:-600,duration:0.5,ease:"power3.inOut"},6.30);
tl.to("#reel3",{y:-600,duration:0.5,ease:"power3.inOut"},6.46);
tl.to("#reel4",{y:-480,duration:0.5,ease:"power3.inOut"},6.62);

tl.to("#reel0",{y:-240,duration:0.5,ease:"power3.inOut"},10.80);
tl.to("#reel1",{y:-240,duration:0.5,ease:"power3.inOut"},10.85);
tl.to("#reel2",{y:-240,duration:0.5,ease:"power3.inOut"},10.90);
tl.to("#reel3",{y:-240,duration:0.5,ease:"power3.inOut"},10.95);
tl.to("#reel4",{y:-240,duration:0.5,ease:"power3.inOut"},11.00);
tl.to(["#fw0","#fw1","#fw2"],{opacity:0,duration:0.25,stagger:0.05},10.80);
tl.set({},{},12.00);
window.__timelines["main"]=tl;
</script>
</body>
</html>
