          "M11 1h2v1H11zM8 2h8v1H8zM7 3h10v1H7zM6 4h3v1H6zM15 4h3v1H15zM5 5h3v1H5zM16 5h3v1H16zM5 6h2v1H5zM17 6h2v1H17zM4 7h2v1H4zM18 7h2v1H18zM4 8h2v1H4zM18 8h2v1H18zM4 9h2v1H4zM18 9h2v1H18zM4 10h2v1H4zM18 10h2v1H18zM4 11h2v1H4zM18 11h2v1H18zM5 12h2v1H5zM17 12h2v1H17zM5 13h3v1H5zM16 13h3v1H16zM6 14h3v1H6zM15 14h3v1H15zM7 15h10v1H7zM9 16h6v1H9zM11 17h2v1H11zM11 18h2v1H11zM11 19h2v1H11zM11 20h2v1H11zM11 21h2v1H11zM11 22h2v1H11z",
        trash:
          "M7 3h10v1H7zM7 4h10v1H7zM2 5h20v1H2zM2 6h20v1H2zM4 7h3v1H4zM17 7h3v1H17zM5 8h2v1H5zM17 8h2v1H17zM5 9h2v1H5zM17 9h2v1H17zM5 10h2v1H5zM17 10h2v1H17zM5 11h2v1H5zM17 11h2v1H17zM5 12h2v1H5zM17 12h2v1H17zM5 13h2v1H5zM17 13h2v1H17zM5 14h2v1H5zM17 14h2v1H17zM5 15h2v1H5zM17 15h2v1H17zM5 16h2v1H5zM17 16h2v1H17zM5 17h2v1H5zM17 17h2v1H17zM5 18h2v1H5zM17 18h2v1H17zM5 19h3v1H5zM16 19h3v1H16zM5 20h14v1H5zM6 21h12v1H6z",
        building:
          "M4 3h11v1H4zM3 4h13v1H3zM3 5h2v1H3zM14 5h2v1H14zM3 6h2v1H3zM14 6h2v1H14zM3 7h2v1H3zM7 7h5v1H7zM14 7h2v1H14zM3 8h2v1H3zM7 8h5v1H7zM14 8h6v1H14zM3 9h2v1H3zM14 9h7v1H14zM3 10h2v1H3zM14 10h2v1H14zM19 10h2v1H19zM3 11h2v1H3zM7 11h5v1H7zM14 11h2v1H14zM19 11h2v1H19zM3 12h2v1H3zM7 12h5v1H7zM14 12h2v1H14zM19 12h2v1H19zM3 13h2v1H3zM14 13h2v1H14zM19 13h2v1H19zM3 14h2v1H3zM14 14h2v1H14zM19 14h2v1H19zM3 15h2v1H3zM7 15h5v1H7zM14 15h2v1H14zM19 15h2v1H19zM3 16h2v1H3zM7 16h5v1H7zM14 16h2v1H14zM19 16h2v1H19zM3 17h2v1H3zM14 17h2v1H14zM19 17h2v1H19zM3 18h2v1H3zM14 18h2v1H14zM19 18h2v1H19zM3 19h2v1H3zM14 19h2v1H14zM19 19h2v1H19zM2 20h20v1H2zM2 21h20v1H2z",
      };
      const PIN_OUTLINE =
        "M12 1C6.2 1 1.5 5.7 1.5 11.5 1.5 19 12 33 12 33s10.5-14 10.5-21.5C22.5 5.7 17.8 1 12 1z";
      const NS = "http://www.w3.org/2000/svg";
      const root = document.querySelector('[data-composition-id="chiuso"]');
      const $ = (sel) => root.querySelector(sel);

      // ── Basemap: streets on a grid in world coordinates ──
      const RIVER_TOP = 748; // blocks above the river stop here
      const RIVER_BOTTOM = 918; // and start again here
      const H = [
        { y: -560, k: "minor" },
        { y: -400, k: "minor" },
        { y: -230, k: "minor" },
        { y: -60, k: "minor" },
        { y: 130, k: "minor" },
        { y: 270, k: "minor" },
        { y: 420, k: "major" }, // Via Appia
        { y: 580, k: "minor" },
        { y: 1000, k: "minor" },
        { y: 1160, k: "minor" },
        { y: 1320, k: "minor" },
        { y: 1480, k: "minor" },
        { y: 1640, k: "minor" },
        { y: 1800, k: "minor" },
      ];
      const V = [
        { x: -60, k: "minor" },
        { x: 130, k: "minor" },
        { x: 330, k: "major" }, // Via Garibaldi
        { x: 520, k: "minor" },
        { x: 720, k: "minor" },
        { x: 880, k: "major" }, // Viale Mazzini
        { x: 1060, k: "minor" },
        { x: 1240, k: "minor" },
      ];
      const LO = -900;
      const HI = 1980;
      const segs = [];
      H.forEach((r) => segs.push({ k: r.k, x1: LO, y1: r.y, x2: HI, y2: r.y }));
      V.forEach((r) => {
        if (r.k === "major") segs.push({ k: r.k, x1: r.x, y1: LO, x2: r.x, y2: HI });
        else {
          // Minor streets end at the river banks; only the main roads bridge it.
          segs.push({ k: r.k, x1: r.x, y1: LO, x2: r.x, y2: RIVER_TOP + 4 });
          segs.push({ k: r.k, x1: r.x, y1: RIVER_BOTTOM - 4, x2: r.x, y2: HI });
        }
      });
      const casings = $("#casings");
      const roads = $("#roads");
      // Minor first, so main roads sit on top where they cross.
      ["minor", "major"].forEach((kind) =>
        segs
          .filter((s) => s.k === kind)
          .forEach((s) => {
            ["casing", "road"].forEach((cls) => {
              const l = document.createElementNS(NS, "line");
              l.setAttribute("x1", s.x1);
              l.setAttribute("y1", s.y1);
              l.setAttribute("x2", s.x2);
              l.setAttribute("y2", s.y2);
              l.setAttribute("class", cls + " " + kind);
              (cls === "casing" ? casings : roads).appendChild(l);
            });
          }),
      );

      // Buildings: outlines in each block (the app draws them as lines), seeded.
      let seed = 20261103;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      const half = (k) => (k === "major" ? 13 : 8);
      const rowsY = [];
      for (let i = 0; i < H.length - 1; i++) {
        let top = H[i].y + half(H[i].k) + 12;
        let bottom = H[i + 1].y - half(H[i + 1].k) - 12;
        if (H[i].y === 580) bottom = RIVER_TOP - 6;
        if (H[i + 1].y === 1000) top = RIVER_BOTTOM + 6;
        rowsY.push([top, bottom]);
      }
      rowsY.unshift([LO, H[0].y - 8 - 12]);
      rowsY.push([H[H.length - 1].y + 8 + 12, HI]);
      const colsX = [];
      for (let i = 0; i < V.length - 1; i++) {
        colsX.push([V[i].x + half(V[i].k) + 12, V[i + 1].x - half(V[i + 1].k) - 12]);
      }
      colsX.unshift([LO, V[0].x - 8 - 12]);
      colsX.push([V[V.length - 1].x + 8 + 12, HI]);
      // An open square in the old centre, where its name plate stands.
      const isPiazza = (cx, cy) => cx > 520 && cx < 720 && cy > 580 && cy < 760;
      const bg = $("#buildings");
      const addRect = (x, y, w, h) => {
        if (w < 14 || h < 14) return;
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", x.toFixed(1));
        r.setAttribute("y", y.toFixed(1));
        r.setAttribute("width", w.toFixed(1));
        r.setAttribute("height", h.toFixed(1));
        r.setAttribute("class", "bld");
        bg.appendChild(r);
      };
      rowsY.forEach(([y0, y1]) =>
        colsX.forEach(([x0, x1]) => {
          if (isPiazza((x0 + x1) / 2, (y0 + y1) / 2)) return;
          const bh = y1 - y0;
          const nRows = bh > 110 ? 2 : 1;
          const gap = 8;
          for (let r = 0; r < nRows; r++) {
            const ry0 = y0 + (r * (bh + gap)) / nRows;
            const rh = bh / nRows - (nRows > 1 ? gap / 2 : 0);
            let x = x0;
            while (x < x1 - 14) {
              const w = Math.min(x1 - x, 34 + rand() * 58);
              const depth = rh * (0.62 + rand() * 0.38);
              const y = r === 0 ? ry0 : ry0 + rh - depth; // buildings face their street
              addRect(x, y, w, nRows > 1 ? depth : rh);
              x += w + gap;
            }
          }
        }),
      );

      // ── Pins: world position → screen position (same -9° turn as #world) ──
      const A = (-9 * Math.PI) / 180;
      const toScreen = (wx, wy) => {
        const dx = wx - 540;
        const dy = wy - 540;
        return [540 + dx * Math.cos(A) - dy * Math.sin(A), 540 + dx * Math.sin(A) + dy * Math.cos(A)];
      };
      const glyphAt = "translate(5.33 4.83) scale(0.5556)"; // 20 px glyph in a 1.5× pin head
      root.querySelectorAll(".pin").forEach((pin) => {
        const [sx, sy] = toScreen(+pin.dataset.wx, +pin.dataset.wy);
        pin.style.left = sx.toFixed(1) + "px";
        pin.style.top = (sy + 466).toFixed(1) + "px"; // il mondo scende di 466 nello slot alto
        const body = document.createElement("div");
        body.className = "pin-body";
        body.id = pin.id + "-body";
        body.innerHTML =
          '<svg viewBox="-1 -1 26 36">' +
          // Green fills the pin from the centre of its head (a circle clip that grows).
          '<defs><clipPath id="' + pin.id + '-clip" class="pin-clip"><circle cx="12" cy="11.5" r="0"/></clipPath></defs>' +
          '<path class="pin-red" d="' + PIN_OUTLINE + '"/>' +
          '<path class="pin-green" clip-path="url(#' + pin.id + '-clip)" d="' + PIN_OUTLINE + '"/>' +
          '<path class="glyph glyph-cat" transform="' + glyphAt + '" d="' + ICON[pin.dataset.glyph] + '"/>' +
          '<path class="glyph glyph-check" transform="' + glyphAt + '" d="' + ICON.check + '"/>' +
          "</svg>";
        pin.appendChild(body);
      });
      $("#nt-check").setAttribute("d", ICON.check);

      // ── Beats (s) ──
      const T_HERO = 1.3; // the chosen pin turns green
      const T_STATUS = 1.75; // callout: Assegnata → Completata
      const T_COUNT_FOCAL = 2.0; // counter 128 → 129
      const T_CARD_IN = 2.85; // in-app notification rises
      const T_PT1 = 3.45;
      const T_PT2 = 3.7;
      const T_XP = 4.15; // 60 → 85 punti
      const XP_DUR = 1.0;
      const T_CARD_OUT = 6.25;
      const T_CITY = 6.75; // the other pins turn green, nearest first
      const CITY_STAGGER = 0.2;
      const OTHERS = ["#pin-d", "#pin-c", "#pin-e", "#pin-a", "#pin-h", "#pin-g", "#pin-f", "#pin-i", "#pin-k", "#pin-j", "#pin-l"];
      const T_RESET_OUT = 9.3; // UI fades, state goes back to the opening
      const T_RESET_SWAP = 9.56;
      const T_RESET_IN = 9.6;

      const COUNT_START = 128;
      const countSteps = [T_COUNT_FOCAL].concat(OTHERS.map((_, i) => T_CITY + i * CITY_STAGGER + 0.12));
      const XP_FROM = 60;
      const XP_TO = 85;
      const xpEase = gsap.parseEase("power2.out");
      // Segment n lights when the points reach n × 10 (litPointSegments, floor).
      const segTime = (target) => T_XP + (1 - Math.sqrt(1 - (target - XP_FROM) / (XP_TO - XP_FROM))) * XP_DUR;

      const numEl = $("#counter-num");
      const xpEl = $("#lv-xp-num");
      function renderTexts(t) {
        let n = COUNT_START;
        if (t < T_RESET_SWAP) countSteps.forEach((s) => { if (t >= s) n++; });
        const ns = String(n);
        if (numEl.textContent !== ns) numEl.textContent = ns;
        const p = Math.min(1, Math.max(0, (t - T_XP) / XP_DUR));
        const xs = String(Math.round(XP_FROM + (XP_TO - XP_FROM) * xpEase(p)));
        if (xpEl.textContent !== xs) xpEl.textContent = xs;
      }

      const ease = "power3.out"; // DESIGN.md cubic-bezier(0.22, 1, 0.36, 1)
      const tl = gsap.timeline({ paused: true });

      // Initial (= final) state, applied immediately
      gsap.set("#notif", { y: 600 });
      gsap.set(["#pt-reporter", "#pt-supporters"], { opacity: 0, y: 14 });

      // 0 → 1.3 — opening: the map, seven red reports, the chosen one selected.

      // 1.3 — HERO: Buca in strada turns green, a calm check replaces the glyph.
      const F = "#pin-focal";
      tl.to("#pin-focal-clip circle", { attr: { r: 26 }, duration: 0.7, ease: "power2.inOut" }, T_HERO);
      tl.to("#halo .halo-red", { opacity: 0, duration: 0.25, ease: "power2.in" }, T_HERO);
      tl.to("#halo-green-wrap", { opacity: 1, duration: 0.4, ease: "power2.out" }, T_HERO + 0.2);
      tl.fromTo("#halo-green-wrap", { scale: 0.6 }, { scale: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, T_HERO + 0.2);
      tl.to(F + " .glyph-cat", { opacity: 0, duration: 0.22, ease: "power2.in" }, T_HERO + 0.12);
      tl.fromTo(
        F + " .glyph-check",
        { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false },
        T_HERO + 0.32,
      );
      tl.to(F + "-body", { scale: 1.07, duration: 0.32, ease: "power2.out" }, T_HERO);
      tl.to(F + "-body", { scale: 1, duration: 0.6, ease: "power2.inOut" }, T_HERO + 0.32);

      // 1.75 — the callout's status follows
      tl.to("#chip-assegnata", { opacity: 0, duration: 0.16, ease: "power2.in" }, T_STATUS);
      tl.to("#chip-completata", { opacity: 1, duration: 0.32, ease }, T_STATUS + 0.18);

      // Counter steps: a short settle each time the number changes
      countSteps.forEach((s) =>
        tl.fromTo(
          "#counter-num",
          { y: 10, opacity: 0.35 },
          { y: 0, opacity: 1, duration: 0.26, ease, immediateRender: false },
          s,
        ),
      );

      // 2.85 — in-app notification for the reporter
      tl.to("#notif", { y: 0, duration: 0.75, ease: "expo.out" }, T_CARD_IN);
      tl.to("#pt-reporter", { opacity: 1, y: 0, duration: 0.45, ease }, T_PT1);
      tl.to("#pt-supporters", { opacity: 1, y: 0, duration: 0.45, ease }, T_PT2);
      // Two more segments of the points bar light as 60 → 85
      tl.to("#seg-7 i", { opacity: 1, duration: 0.25, ease: "power2.out" }, segTime(70));
      tl.to("#seg-8 i", { opacity: 1, duration: 0.25, ease: "power2.out" }, segTime(80));

      // 6.25 — the sheet goes down
      tl.to("#notif", { y: 600, duration: 0.45, ease: "power3.in" }, T_CARD_OUT);

      // 6.75 — across the city, the other reports are closed one after another
      OTHERS.forEach((id, i) => {
        const t = T_CITY + i * CITY_STAGGER;
        tl.to(id + "-clip circle", { attr: { r: 26 }, duration: 0.5, ease: "power2.inOut" }, t);
        tl.to(id + " .glyph-cat", { opacity: 0, duration: 0.18, ease: "power2.in" }, t + 0.08);
        tl.fromTo(
          id + " .glyph-check",
          { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false },
          t + 0.22,
        );
      });

      // 9.3 — loop reset: the UI layer dips out, the opening state returns under it
      tl.to("#ui", { opacity: 0, duration: 0.24, ease: "power2.in" }, T_RESET_OUT);
      tl.set(".pin-clip circle", { attr: { r: 0 } }, T_RESET_SWAP);
      tl.set(".glyph-cat", { opacity: 1 }, T_RESET_SWAP);
      tl.set(".glyph-check", { opacity: 0, scale: 0.7 }, T_RESET_SWAP);
      tl.set("#halo-green-wrap", { opacity: 0, scale: 0.6 }, T_RESET_SWAP);
      tl.set("#halo .halo-red", { opacity: 0.18 }, T_RESET_SWAP);
      tl.set("#chip-assegnata", { opacity: 1 }, T_RESET_SWAP);
      tl.set("#chip-completata", { opacity: 0 }, T_RESET_SWAP);
      tl.set(["#seg-7 i", "#seg-8 i"], { opacity: 0 }, T_RESET_SWAP);
      tl.set(["#pt-reporter", "#pt-supporters"], { opacity: 0, y: 14 }, T_RESET_SWAP);
      tl.to("#ui", { opacity: 1, duration: 0.34, ease: "power2.out" }, T_RESET_IN);

      // Hold the opening state to 10.0 — identical to frame 0.
      tl.set({}, {}, 10);

      tl.eventCallback("onUpdate", () => renderTexts(tl.time()));
      window.addEventListener("hf-seek", (e) => renderTexts(e.detail.time));
      renderTexts(0);

      window.__timelines["chiuso"] = tl;
    })();
  </script>
</template>
