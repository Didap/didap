<template>
  <style>

      font-family: "Dunbar Tall";
      src: url("assets/fonts/DunbarTall-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {

    @font-face {
      font-family: "Urbanist";
      font-style: normal;

      src: url("assets/fonts/urbanist-latin-ext-wght-normal.woff2") format("woff2");
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: "Urbanist";
      font-style: normal;
      font-weight: 100 900;
      src: url("assets/fonts/urbanist-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;

      --bar: #2b1ce8;
      --ink: #0a0a0f;
      --ink-muted: #52525c;
      --paper: #f4f4f4;
      --paper-deep: #e6e6e9;
      --white: #fefeff;
      --track: var(--report-track, 520px); /* bar area height: the host sets it per slot */

      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      font-family: "Urbanist", sans-serif;
      color: var(--ink);

    /* Report card - MayorView .report, rifatta per gli slot della scheda: larghezza, colonne dei numeri

    #report-card {
      width: var(--report-card, 1440px);
      padding: 56px 64px 52px;
      background: var(--white);
      border-radius: 36px;
      box-shadow:
        0 2px 0 var(--paper-deep),
        0 42px 92px -56px rgba(43, 28, 232, 0.38);
    }
    .report-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .report-title {
      font-family: "Dunbar Tall", sans-serif;
      font-weight: 500;
      font-size: 48px;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .report-sample {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 9px 22px 10px 18px;
      border-radius: 999px;
      background: var(--paper);
      font-size: 28px;
      line-height: 1.2;
      color: var(--ink-muted);
      white-space: nowrap;
    }
    .report-sample-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #8a8a93;
    }

    .report-kpis {
      display: grid;
      grid-template-columns: repeat(var(--report-cols, 4), 1fr);
      gap: 20px;
      margin-top: 34px;

    .kpi {
      padding: 24px 28px 28px;
      border-radius: 20px;

    .kpi-label {
      font-size: 28px;
      line-height: 1.2;
      color: var(--ink-muted);
      white-space: nowrap;

    .kpi-value {
      margin-top: 12px;
      font-family: "Dunbar Tall", sans-serif;
      font-weight: 700;
      font-size: 84px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .kpi-unit {
      margin-left: 12px;
      font-size: 46px;
      letter-spacing: 0;
    }

    .chart-label {
      margin-top: 38px;
      font-size: 28px;
      line-height: 1.2;
      color: var(--ink-muted);
    }
    .chart {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 12px;
      margin-top: 20px;
    }
    .chart-base {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--track);
      height: 2px;
      background: var(--paper-deep);
    }
    .bar {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bar-track {
      position: relative;
      width: 100%;
      height: var(--track);
      display: flex;
      align-items: flex-end;
    }
    .bar-fill {
      display: block;
      width: 100%;
      border-radius: 8px 8px 0 0;
      background: var(--bar);
      transform-origin: 50% 100%;
    }
    .bar-month {
      margin-top: 12px;
      font-weight: 500;
      font-size: 25px;
      line-height: 1;
      color: var(--ink-muted);
    }
    .bar-tag {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Dunbar Tall", sans-serif;
      font-weight: 700;
      font-size: 30px;
      line-height: 1;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="report">
    <article id="report-card">
      <header class="report-head">
        <p id="report-title" class="report-title">Resoconto 2026</p>
        <span id="report-sample" class="report-sample"><span class="report-sample-dot"></span>Dati di esempio</span>
      </header>

      <div class="report-kpis">
        <div class="kpi" id="kpi-solved">
          <p class="kpi-label">Problemi risolti</p>
          <p class="kpi-value" id="kpi-solved-value"><span class="kpi-num">412</span></p>
        </div>
        <div class="kpi" id="kpi-ontime">
          <p class="kpi-label">Rispettati nei tempi</p>
          <p class="kpi-value" id="kpi-ontime-value"><span class="kpi-num">87</span>%</p>
        </div>
        <div class="kpi" id="kpi-days">
          <p class="kpi-label">Tempo medio di risoluzione</p>
          <p class="kpi-value" id="kpi-days-value"><span class="kpi-num">6</span><span class="kpi-unit">giorni</span></p>
        </div>
        <div class="kpi" id="kpi-citizens">
          <p class="kpi-label">Cittadini attivi</p>
          <p class="kpi-value" id="kpi-citizens-value"><span class="kpi-num">1.240</span></p>
        </div>
      </div>

      <p class="chart-label" id="chart-label">Problemi risolti per mese</p>
      <div class="chart" id="chart">
        <span class="chart-base"></span>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-0"></span></div><span class="bar-month">Gen</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-1"></span></div><span class="bar-month">Feb</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-2"></span></div><span class="bar-month">Mar</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-3"></span></div><span class="bar-month">Apr</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-4"></span></div><span class="bar-month">Mag</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-5"></span></div><span class="bar-month">Giu</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-6"></span></div><span class="bar-month">Lug</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-7"></span></div><span class="bar-month">Ago</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-8"></span></div><span class="bar-month">Set</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-9"></span></div><span class="bar-month">Ott</span></div>
        <div class="bar"><div class="bar-track"><span class="bar-fill" id="bar-10"></span></div><span class="bar-month">Nov</span></div>
        <div class="bar">
          <div class="bar-track">
            <span class="bar-fill" id="bar-11"></span>
            <span class="bar-tag" id="bar-tag">46</span>
          </div>
          <span class="bar-month">Dic</span>
        </div>
      </div>
    </article>
  </div>

  <script>
    (function () {
      // ── Example data (same figures as MayorView.astro) ──
      const MONTHS = [18, 24, 29, 33, 31, 38, 35, 27, 41, 44, 39, 46];
      const MAX = Math.max(...MONTHS);
      const TRACK = parseFloat(getComputedStyle(document.getElementById("report-card")).getPropertyValue("--track"));

      const KPIS = [
        { sel: "#kpi-solved-value", to: 412, start: 1.9, dur: 1.4 },
        { sel: "#kpi-ontime-value", to: 87, start: 2.5, dur: 1.4 },
        { sel: "#kpi-days-value", to: 6, start: 3.1, dur: 1.2 },
        { sel: "#kpi-citizens-value", to: 1240, start: 3.7, dur: 1.4 },
      ];

      // ── Beats (s). 0 → 1.0 continues the previous loop's full-report hold. ──
      const T_RESET = 1.0; // values fade out, bars drop
      const T_ZERO = 1.25; // values are hidden: their text switches to 0 here
      const T_BARS = 4.3; // monthly bars grow, left → right (overlaps the last counter's tail)
      const BAR_STAGGER = 0.09;
      const BAR_DUR = 0.7;
      const T_TAG = T_BARS + 11 * BAR_STAGGER + 0.55; // December value appears

      // Bar heights come from the data; motion is scaleY only.
      MONTHS.forEach((m, i) => {
        const h = Math.round((m / MAX) * TRACK);
        document.getElementById("bar-" + i).style.height = h + "px";
        if (i === 11) document.getElementById("bar-tag").style.bottom = h + 10 + "px";
      });

      const numEls = KPIS.map((k) => document.querySelector(k.sel + " .kpi-num"));
      const countEase = gsap.parseEase("power3.out");
      const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); // 1240 → 1.240

      // Counter text is a pure function of timeline time.
      function renderCounters(t) {
        KPIS.forEach((k, i) => {
          let v = k.to;
          if (t >= T_ZERO) {
            const p = Math.min(1, Math.max(0, (t - k.start) / k.dur));
            v = Math.round(k.to * countEase(p));
          }
          const s = fmt(v);
          if (numEls[i].textContent !== s) numEls[i].textContent = s;
        });
      }

      const ease = "power3.out"; // ease-out-quart, DESIGN.md cubic-bezier(0.22, 1, 0.36, 1)
      const tl = gsap.timeline({ paused: true });

      // 1.0 - reset: December tag and values fade, bars drop together
      tl.fromTo("#bar-tag", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, T_RESET);
      tl.fromTo(
        ".kpi-value",
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "power2.in", stagger: 0.02 },
        T_RESET + 0.03,
      );
      tl.fromTo(
        ".bar-fill",
        { scaleY: 1 },
        { scaleY: 0, duration: 0.4, ease: "power3.in", stagger: { each: 0.012, from: "end" } },
        T_RESET + 0.08,
      );
      // 1.35 - zeroed values return
      tl.to(".kpi-value", { opacity: 1, duration: 0.3, ease, stagger: 0.03 }, 1.35);

      // 1.9 → 5.1 - the four counters run one after another (text from renderCounters)

      // 4.3 → 6.0 - monthly bars grow left to right
      tl.to(".bar-fill", { scaleY: 1, duration: BAR_DUR, ease, stagger: BAR_STAGGER }, T_BARS);
      // ~5.85 - December value
      tl.to("#bar-tag", { opacity: 1, duration: 0.3, ease }, T_TAG);

      // Hold the full report until 10.0 (a second more than the landing, like the other
      // clips of the page) - identical to frame 0.
      tl.set({}, {}, 10);

      tl.eventCallback("onUpdate", () => renderCounters(tl.time()));
      window.addEventListener("hf-seek", (e) => renderCounters(e.detail.time));
      renderCounters(0);

      window.__timelines["report"] = tl;
    })();
  </script>
</template>
