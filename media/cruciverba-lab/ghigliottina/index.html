<style>

:root{--paper:#FCFCF9;--ink:#1F130E;--soft:#473A33;--mute:#6D6059;--gh:#9A5A12;--vivid:#D9731F;--tile:#F8E6D6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:816px;height:1520px;overflow:hidden;background:var(--paper)}
#root{position:absolute;inset:0;background:var(--paper);font-family:Piazzolla,serif;color:var(--ink)}
.title{position:absolute;left:70px;top:110px;font-family:Caprasimo;font-size:64px;color:var(--gh)}
.slot{position:absolute;width:318px;height:132px;border:2px dashed #E7B48C;border-radius:6px;background:var(--tile)}
.card{position:absolute;width:318px;height:132px;border:2px solid var(--ink);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Caprasimo;font-size:38px;letter-spacing:.03em;box-shadow:0 4px 0 var(--ink)}
.card.win{background:var(--ink);color:var(--paper)}
.o{position:absolute;width:40px;text-align:center;font-style:italic;font-size:28px;color:var(--mute)}
.ans{position:absolute;left:70px;right:70px;top:1160px;height:150px;border-top:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-family:Caprasimo;font-size:88px;color:var(--vivid)}
.ans span{opacity:0}
</style>
</head>
