          <p class="nomi"><span id="n1">Hanken Grotesk</span><br /><span id="n2">Poligrapher Grotesk</span> · <span id="n3">Pacifico</span></p>
        </div>
      </div>
    </div>

    <script>
      /* helllo:pen {"sets":{"pw":{"px":8,"step":0.25,"reach":9,"margin":1}}} */
      const SETS = {
        pw: { px: 8, step: 0.25, reach: 9, margin: 1 },
      };
      const NS = 'http://www.w3.org/2000/svg';
      for (const [id, o] of Object.entries(SETS)) {
        // [x, y, arc length, line], and where each l starts (joints)
        const pts = [];
        const joints = [];
        let total = 0;
        [...document.querySelectorAll('.line[data-set="' + id + '"]')].forEach((line, n) => {
          const L = line.getTotalLength();
          for (let a = 0; a <= L; a += o.step) { const q = line.getPointAtLength(a); pts.push([q.x, q.y, total + a, n]); }
          if (n) joints.push(line.dataset.joint.split(' ').map(Number));
          total += L;
        });
        // The glyphs, to measure them
        const g = document.getElementById(id);
        const b = g.getBBox();
        const x0 = b.x - 2, y0 = b.y - 2, W = Math.ceil((b.width + 4) * o.px), H = Math.ceil((b.height + 4) * o.px);
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(o.px, 0, 0, o.px, -x0 * o.px, -y0 * o.px);
        for (const glyph of g.children) ctx.fill(new Path2D(glyph.getAttribute('d')));
        const fill = ctx.getImageData(0, 0, W, H).data;
        const inside = (x, y) => {
          const px = Math.floor((x - x0) * o.px), py = Math.floor((y - y0) * o.px);
          return px >= 0 && py >= 0 && px < W && py < H && fill[4 * (py * W + px) + 3] > 127;
        };
        // Half width of the stroke on each side of the line, at each point: [left, right,
        // normal x, normal y], the smallest one nearby, so where strokes touch it keeps
        // its own width
        const side = pts.map((q, i) => {
          const a = pts[Math.max(0, i - 2)], c = pts[Math.min(pts.length - 1, i + 2)];
          const n = Math.hypot(c[0] - a[0], c[1] - a[1]) || 1, nx = (a[1] - c[1]) / n, ny = (c[0] - a[0]) / n;
          let l = 0, r = 0;
          while (l < o.reach && inside(q[0] - nx * l, q[1] - ny * l)) l += 0.25;
          while (r < o.reach && inside(q[0] + nx * r, q[1] + ny * r)) r += 0.25;
          return [l, r, nx, ny];
        });
        const near = Math.round(o.reach * 0.6 / o.step);
        const around = (w, i) => w.slice(Math.max(0, i - near), i + near + 1);
        const nib = [0, 1].map((h) => side.map((_, i) => Math.min(...around(side, i).map((q) => q[h]))));
        // Where one l runs into the next the strokes cross and the measure is wrong: there
        // the stroke arriving keeps the width it had up to the next line, which narrows
        // evenly, across the bottom of the l and up, to the width it has after the crossing
        const joint = (q) => joints.some(([jx, jy]) => Math.hypot(q[0] - jx, q[1] - jy) < o.reach * 2);
        for (let i = 0; i < pts.length; i++) {
          if (!joint(pts[i])) continue;
          let j = i;
          while (j + 1 < pts.length && joint(pts[j + 1])) j++;
          const after = pts[Math.min(pts.length - 1, j + 1)];
          let up = i;
          while (up <= j && pts[up][3] !== after[3]) up++;
          for (const w of nib) {
            const a = w[Math.max(0, i - 1)], c = w[Math.min(pts.length - 1, j + 1)];
            for (let k = i; k <= j; k++) w[k] = k < up ? a : a + (c - a) * (k - up + 1) / (j - up + 2);
          }
          i = j;
        }
        // eased along the line, so the pen does not change size in steps
        const size = nib.map((w) => w.map((_, i) => {
          const span = around(w, i);
          return span.reduce((t, v) => t + v, 0) / span.length;
        }));
        // The pen: from each point to the next, a round stroke centred between the two
        // edges, a little wider than the glyph (the glyphs clip it). It shows once the
        // writing passes its point, fading in over one unit, which softens the tip.
        const at = (i) => {
          const [x, y] = pts[i], [l, r] = [size[0][i], size[1][i]], [, , nx, ny] = side[i];
          return [x + nx * (r - l) / 2, y + ny * (r - l) / 2, (l + r) / 2];
        };
        const penGroup = document.getElementById(id + '-pen');
        const T = (total + o.margin).toFixed(2);
        for (let i = 0; i < pts.length - 1; i++) {
          const [x1, y1, h1] = at(i), [x2, y2, h2] = at(i + 1);
          const seg = document.createElementNS(NS, 'line');
          seg.setAttribute('x1', x1.toFixed(2)); seg.setAttribute('y1', y1.toFixed(2));
          seg.setAttribute('x2', x2.toFixed(2)); seg.setAttribute('y2', y2.toFixed(2));
          seg.setAttribute('stroke-width', (h1 + h2 + 2).toFixed(2));
          seg.style.opacity = 'clamp(0, var(--' + id + ') * ' + T + ' - ' + pts[i][2].toFixed(2) + ', 1)';
          penGroup.appendChild(seg);
        }
      }
      // every pen starts with nothing written
      for (const id of Object.keys(SETS)) gsap.set('#' + id + '-pen', { ['--' + id]: 0 });
      // Ease 55% out, 85% in: cubic-bezier(0.55, 0, 0.15, 1) (Brand Guidelines 20)
      const bezier = (x1, y1, x2, y2) => (t) => {
        const f = (a, b, s) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
        let lo = 0, hi = 1, s = t;
        for (let i = 0; i < 24; i++) { if (f(x1, x2, s) < t) lo = s; else hi = s; s = (lo + hi) / 2; }
        return f(y1, y2, s);
      };
      const pen = bezier(0.55, 0, 0.15, 1);
      const FRAME = 1 / 24;
      // A set written from 0 to 1 (or back), then the glyphs take over from the pen
      const write = (tl, id, at, duration, back = false) => {
        if (!back) tl.set('#' + id + '-pen', { opacity: 1 }, at);
        tl.fromTo('#' + id + '-pen', { ['--' + id]: back ? 1 : 0 }, { ['--' + id]: back ? 0 : 1, duration, ease: pen, immediateRender: false }, at);
        if (back) return;
        tl.to('#' + id, { opacity: 1, duration: 0.15, ease: 'none' }, at + duration);
        tl.set('#' + id + '-pen', { opacity: 0 }, at + duration + 0.2);
      };
      // The letters fall whole: 30 degrees and 20% higher, in 5 frames, no bounce. Works on
      // svg groups (turning on the bottom centre of the box) and on html elements.
      const fall = (tl, sel, at, turn) => {
        const el = document.querySelector(sel);
        const svg = el instanceof SVGElement;
        const box = svg ? el.getBBox() : { x: 0, y: 0, width: el.offsetWidth, height: el.offsetHeight };
        const pivot = svg ? { svgOrigin: (box.x + box.width / 2) + ' ' + (box.y + box.height) } : { transformOrigin: '50% 100%' };
        tl.set(sel, { opacity: 1 }, at);
        tl.fromTo(sel, { y: -0.2 * box.height, rotation: turn, ...pivot }, { y: 0, rotation: 0, duration: 5 * FRAME, ease: 'power3.in', immediateRender: false }, at);
      };
      /* /helllo:pen */
      const D = 12;
      const EASE = 'expo.out';
      const tl = gsap.timeline({ paused: true });

      // Le cifre dei codici, una per una
      const hex = [];
      document.querySelectorAll('.hex').forEach((h) => {
        h.innerHTML = [...h.textContent].map((c) => '<span>' + c + '</span>').join('');
        hex.push([...h.children]);
      });
      const barre = [...document.querySelectorAll('.barra')];
      gsap.set(barre.map((b) => b.querySelector('i')), { scaleX: 0, transformOrigin: '0% 50%' });
      gsap.set(barre.map((b) => b.querySelector('b')), { opacity: 0 });
      gsap.set(hex.flat(), { opacity: 0 });
      gsap.set(['#aa1', '.nomi'], { opacity: 0 });

      // 0.3: il marchio, le lettere cadono e le lll si scrivono
      fall(tl, '#wm-h', 0.3, 30);
      fall(tl, '#wm-e', 0.4, -30);
      write(tl, 'pw', 0.55, 1.4);
      fall(tl, '#wm-o', 1.85, 30);

      // 1.1: i colori, da sinistra, e i loro codici
      barre.forEach((b, i) => {
        const at = 1.1 + i * 0.14;
        tl.fromTo(b.querySelector('i'), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: EASE, immediateRender: false }, at);
        tl.fromTo(b.querySelector('b'), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: EASE, immediateRender: false }, at + 0.3);
        hex[i].forEach((c, k) => tl.set(c, { opacity: 1 }, at + 0.5 + k * 0.035));
      });

      // 2.5: i caratteri
      tl.fromTo('#aa1', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power4.out', immediateRender: false }, 2.5);
      tl.fromTo('.nomi', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power4.out', immediateRender: false }, 2.6);
      // 5.0: Aa in Pacifico, poi di nuovo in Hanken Grotesk; il nome acceso è quello in uso
      const scambia = (at, a, b, acceso) => {
        tl.to(a, { opacity: 0, filter: 'blur(6px)', duration: 0.15, ease: 'power2.in' }, at);
        tl.fromTo(b, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', immediateRender: false }, at + 0.12);
        tl.to(['#n1', '#n2', '#n3'], { opacity: 0.4, duration: 0.25, ease: 'power2.out' }, at);
        tl.to(acceso, { opacity: 1, duration: 0.25, ease: 'power2.out' }, at);
      };
      scambia(4.4, '#aa1', '#aa2', '#n3');
      scambia(6.9, '#aa2', '#aa1', '#n1');
      tl.to(['#n1', '#n2', '#n3'], { opacity: 1, duration: 0.3, ease: 'power2.out' }, 8.6);

      // 10.4: si torna al foglio vuoto
      tl.to(['#tipi', '#wm'], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 10.4);
      barre.slice().reverse().forEach((b, i) => {
        const at = 10.5 + i * 0.08;
        tl.to([b.querySelector('b'), ...hex[barre.length - 1 - i]], { opacity: 0, duration: 0.2, ease: 'power2.in' }, at);
        tl.to(b.querySelector('i'), { scaleX: 0, transformOrigin: '100% 50%', duration: 0.45, ease: 'power3.in' }, at);
      });
      tl.set(['#aa1', '.nomi'], { opacity: 0 }, 11.5);
      tl.set(['#tipi', '#wm'], { opacity: 1 }, 11.5);
      tl.set(['#wm-h', '#wm-e', '#wm-o', '#pw'], { opacity: 0 }, 11.5);
      tl.set(barre.map((b) => b.querySelector('i')), { transformOrigin: '0% 50%' }, 11.5);
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
