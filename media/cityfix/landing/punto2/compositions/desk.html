    <div class="dk-cursor" id="dk-cursor">
      <svg width="50" height="55" viewBox="0 0 40 44" aria-hidden="true">
        <path
          d="M3 3 L3 33 L10.5 26 L15.8 38.5 L21 36.3 L15.8 24.2 L26 24.2 Z"
          fill="#0a0a0f"
          stroke="#fefeff"
          stroke-width="2.4"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const OUT = "power3.out"; // ~ cubic-bezier(0.22, 1, 0.36, 1)
      const MOVE = "power3.inOut";
      const NI = { immediateRender: false };

      // Fine del giro: la lista sfuma a H2 per il loop (bid.html sfuma insieme)
      const H2 = 12.8;

      // Cursor tip positions (canvas px). Card origin = (48, 128); drawer content origin = (452, 214).
      const P = {
        start: { x: 1000, y: 1040 },
        row: { x: 270, y: 563 },
        alta: { x: 902, y: 470 },
        imp: { x: 760, y: 632 },
        opt: { x: 700, y: 724 },
        amt: { x: 600, y: 796 },
        btn: { x: 740, y: 934 },
        exit: { x: 1010, y: 1060 },
      };
      const TIP = 4; // tip of the 1.25x arrow inside its box
      const cur = "#dk-cursor";
      const to = (p, t, d, ease = MOVE) => tl.to(cur, { x: p.x - TIP, y: p.y - TIP, duration: d, ease }, t);
      const click = (t) => {
        tl.to(cur, { scale: 0.86, duration: 0.07, ease: "power2.out" }, t);
        tl.to(cur, { scale: 1, duration: 0.16, ease: OUT }, t + 0.07);
      };

      // ---- Opening state (t = 0, identical to the last frame) ----
      tl.set("#dk-screen", { x: 0, opacity: 1 }, 0);
      tl.set(cur, { x: P.start.x - TIP, y: P.start.y - TIP, scale: 1, opacity: 0 }, 0);
      tl.set("#dk-drawer", { x: 700 }, 0);
      tl.set("#dk-pill", { x: 180 }, 0);
      tl.set("#dk-menu", { y: -8 }, 0);
      tl.set("#dk-btn", { scale: 1 }, 0);

      // 1) Cursor opens "Buca in strada" (0.6 - 1.9)
      tl.to(cur, { opacity: 1, duration: 0.2, ease: "none" }, 0.6);
      to(P.row, 0.6, 0.6);
      tl.to("#dk-r2-hover", { opacity: 1, duration: 0.15, ease: "none" }, 1.0);
      click(1.22);
      tl.to("#dk-r2-sel", { opacity: 1, duration: 0.2, ease: OUT }, 1.26);
      tl.set("#dk-r2-hover", { opacity: 0 }, 1.46);
      tl.to("#dk-scrim", { opacity: 1, duration: 0.4, ease: OUT }, 1.3);
      tl.to("#dk-drawer", { x: 0, duration: 0.6, ease: "expo.out" }, 1.3);

      // 2) Priorità -> Alta (1.95 - 2.8)
      to(P.alta, 1.95, 0.45);
      click(2.42);
      tl.to("#dk-pill", { x: 360, backgroundColor: "#fde8e8", duration: 0.35, ease: OUT }, 2.46);
      tl.to("#dk-seg-mid-on", { opacity: 0, duration: 0.2, ease: "none" }, 2.46);
      tl.to("#dk-seg-mid-off", { opacity: 1, duration: 0.2, ease: "none" }, 2.46);
      tl.to("#dk-seg-alta-off", { opacity: 0, duration: 0.2, ease: "none" }, 2.5);
      tl.to("#dk-seg-alta-on", { opacity: 1, duration: 0.2, ease: "none" }, 2.5);
      tl.set("#dk-prio-mid", { opacity: 0 }, 2.5);
      tl.set("#dk-prio-high", { opacity: 1 }, 2.5);

      // 3) Impresa: Edilstrade Rossi (2.8 - 3.9)
      to(P.imp, 2.8, 0.42);
      click(3.24);
      tl.to("#dk-ring-imp", { opacity: 1, duration: 0.15, ease: "none" }, 3.28);
      tl.to("#dk-menu", { opacity: 1, y: 0, duration: 0.25, ease: OUT }, 3.3);
      to(P.opt, 3.42, 0.3);
      tl.to("#dk-opt-hl", { opacity: 1, duration: 0.12, ease: "none" }, 3.6);
      click(3.76);
      tl.to("#dk-menu", { opacity: 0, y: -6, duration: 0.16, ease: "power2.in" }, 3.82);
      tl.set("#dk-imp-ph", { opacity: 0 }, 3.84);
      tl.set("#dk-imp-val", { opacity: 1 }, 3.84);

      // 4) Importo € 480, Tab, Scadenza 3 giorni (3.95 - 5.1)
      to(P.amt, 3.95, 0.36);
      click(4.33);
      tl.to("#dk-ring-imp", { opacity: 0, duration: 0.12, ease: "none" }, 4.36);
      tl.to("#dk-ring-amt", { opacity: 1, duration: 0.12, ease: "none" }, 4.36);
      tl.set("#dk-caret-amt", { opacity: 1 }, 4.38);
      tl.set("#dk-a1", { display: "inline" }, 4.5);
      tl.set("#dk-a2", { display: "inline" }, 4.6);
      tl.set("#dk-a3", { display: "inline" }, 4.7);
      tl.set("#dk-caret-amt", { opacity: 0 }, 4.88);
      tl.to("#dk-ring-amt", { opacity: 0, duration: 0.12, ease: "none" }, 4.88);
      tl.to("#dk-ring-due", { opacity: 1, duration: 0.12, ease: "none" }, 4.88);
      tl.set("#dk-caret-due", { opacity: 1 }, 4.88);
      tl.set("#dk-d1", { display: "inline" }, 5.02);

      // 5) Affida all'impresa (5.15 - 6.0)
      to(P.btn, 5.15, 0.4);
      click(5.58);
      tl.to("#dk-btn", { scale: 0.97, backgroundColor: "#130378", duration: 0.08, ease: "power2.out" }, 5.58);
      tl.to("#dk-btn", { scale: 1, backgroundColor: "#2b1ce8", duration: 0.2, ease: OUT }, 5.66);
      tl.to(cur, { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.72);
      to(P.exit, 5.72, 0.45, "power2.in");
      tl.to("#dk-drawer", { x: 700, duration: 0.4, ease: "power3.inOut" }, 5.7);
      tl.to("#dk-scrim", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 5.74);
      tl.to("#dk-r2-sel", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 5.8);

      // 6) Status Presa in carico -> Assegnata (6.1 - 6.6), hold until the handover
      tl.to("#dk-st-presa", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 6.1);
      tl.fromTo("#dk-st-ass", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT, ...NI }, 6.26);
      tl.to("#dk-sub-a", { opacity: 0, duration: 0.2, ease: "none" }, 6.36);
      tl.to("#dk-sub-b", { opacity: 1, duration: 0.3, ease: "none" }, 6.42);

      // 7) Nella scheda il comune e l'impresa stanno affiancati: la lista resta su
      //    "Assegnata" mentre l'impresa lavora, poi sfuma per il loop
      tl.to("#dk-screen", { opacity: 0, duration: 0.3, ease: "power2.in" }, H2);

      // 8) Sotto la sfumatura: tutto torna allo stato iniziale
      const R = H2 + 0.35;
      tl.set("#dk-st-presa", { opacity: 1, y: 0 }, R);
      tl.set("#dk-st-ass", { opacity: 0, y: 0 }, R);
      tl.set("#dk-prio-mid", { opacity: 1 }, R);
      tl.set("#dk-prio-high", { opacity: 0 }, R);
      tl.set("#dk-sub-a", { opacity: 1 }, R);
      tl.set("#dk-sub-b", { opacity: 0 }, R);
      tl.set("#dk-pill", { x: 180, backgroundColor: "#fefeff" }, R);
      tl.set(["#dk-seg-mid-on", "#dk-seg-alta-off", "#dk-imp-ph"], { opacity: 1 }, R);
      tl.set(["#dk-seg-mid-off", "#dk-seg-alta-on", "#dk-imp-val", "#dk-opt-hl", "#dk-ring-due", "#dk-caret-due"], { opacity: 0 }, R);
      tl.set(["#dk-a1", "#dk-a2", "#dk-a3", "#dk-d1"], { display: "none" }, R);
      tl.set("#dk-menu", { y: -8 }, R);
      tl.set(cur, { x: P.start.x - TIP, y: P.start.y - TIP, scale: 1, opacity: 0 }, R);

      // 9) Loop: la lista iniziale torna prima dell'ultimo fotogramma
      tl.to("#dk-screen", { opacity: 1, duration: 0.4, ease: OUT }, R + 0.05);

      window.__timelines["desk"] = tl;
    })();
  </script>
</template>
